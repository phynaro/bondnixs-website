services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    env_file:
      - ./frontend/.env.development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bondnixs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - bondnixs-network

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=bondnixs_dev
      - POSTGRES_USER=bondnixs_dev
      - POSTGRES_PASSWORD=devpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bondnixs-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bondnixs-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.development.conf:/etc/nginx/nginx.conf
      - /var/www/html:/var/www/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - bondnixs-network

volumes:
  postgres_data:
  redis_data:

networks:
  bondnixs-network:
    driver: bridge
